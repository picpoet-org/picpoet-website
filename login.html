<body class="create-page" data-user-page="login"><a class="skip-link" href="#main">跳到主要内容</a><header class="site-header"><a class="brand" href="index.html"><img src="assets/picpoet-mark.svg" width="32" height="32" alt="">图赋 PicPoet</a><nav aria-label="主导航"><a href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>首页</a><a href="create.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>在线创作</a><a href="works.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m3 16 5-4 4 3 3-2 6 4"/></svg>我的作品</a><a href="account.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.25"/><path d="M5 19.5a7 7 0 0 1 14 0"/></svg>个人中心</a></nav></header><main id="main" class="shell" tabindex="-1"><section class="create-intro"><p class="eyebrow">图赋 · 让照片有诗可读</p><h1>欢迎来到图赋</h1><p class="lede">登录已有账户，或注册并验证邮箱。你的作品与次数会随账户保存。</p></section><noscript><p class="notice">此页面需要 JavaScript，请启用后重试。</p></noscript><p id="page-status" class="create-status" role="status" aria-live="polite" tabindex="-1">正在检查登录状态…</p><button id="retry-session" class="button secondary" type="button" hidden>重试连接</button><aside id="login-gate" class="notice" hidden><h2>登录后继续</h2><p>使用同一个账户，继续创作、查看作品和管理次数。</p><a id="login-link" class="button primary" href="login.html">登录 / 注册</a></aside><div class="login-layout">    <section class="create-panel account-panel" aria-labelledby="account-title">
      
      <button id="retry-logout" type="button" class="button secondary" hidden>重试退出</button>
      <div class="section-top"><h2 id="account-title">登录 / 注册</h2><button id="logout" class="button secondary" type="button" hidden>退出登录</button></div>
<div id="account-summary" hidden><p id="account-name"></p><a id="continue-link" class="button primary" href="create.html">继续</a></div>      <div id="auth-panel">
        <div id="auth-switch" class="auth-switch" role="group" aria-label="账户操作" hidden><button type="button" id="mode-login" aria-pressed="true">登录</button><button type="button" id="mode-register" aria-pressed="false">注册新账户</button></div>
        <p id="auth-status" class="create-status" role="status" aria-live="polite" tabindex="-1"></p>
        <form id="auth-form">
          <fieldset id="auth-fields" disabled>
            <div class="form-grid">
              <div id="auth-mode-field"><label for="auth-mode">账户操作</label><select id="auth-mode" name="mode"><option value="login">登录</option><option value="register">注册新账户</option></select></div>
              <div><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
              <div><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required aria-describedby="password-help"><small id="password-help">注册密码至少 8 位。</small></div>
              <div id="invitation-field" hidden><label for="invitation">邀请码（可选）</label><input id="invitation" name="invitationCode" autocomplete="off" maxlength="40"></div>
            </div>
            <button id="auth-submit" class="button primary" type="submit">登录</button>
          </fieldset>
        </form>
      </div>
      <details id="verify-panel"><summary>验证邮箱 / 重新发送验证码</summary>
        <p id="verify-status" class="create-status" role="status" aria-live="polite" tabindex="-1"></p>
        <form id="verify-form"><fieldset id="verify-fields" disabled>
          <div class="form-grid"><div><label for="verify-email">待验证邮箱</label><input id="verify-email" type="email" autocomplete="email" maxlength="254" required></div><div><label for="otp">邮件验证码</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="32" required></div></div>
          <div class="actions"><button type="submit" class="button primary">验证邮箱</button><button id="resend-otp" type="button" class="button secondary">重发验证码</button></div>
        </fieldset></form>
        <p class="fine-print">邮件可能稍有延迟，请检查垃圾邮件。重发后请稍候，避免频繁操作。</p>
      </details>
    </section>
</div></main><footer class="site-footer shell"><span>图赋 PicPoet · 让照片有诗可读</span><nav aria-label="页脚导航"><a href="docs.html">使用说明</a><a href="pricing.html">费用说明</a><a href="downloads.html">下载客户端</a></nav></footer></body></html>
