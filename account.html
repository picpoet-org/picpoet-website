<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在这里管理账户、创作次数和购买订单。">
  <meta name="referrer" content="no-referrer">
  <title>个人中心 · 图赋 PicPoet</title>
  <link rel="icon" href="assets/picpoet-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shared/picpoet-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shared/create.css">
  <script type="module" src="shared/create.mjs"></script>
</head>
<body class="create-page account-page" data-user-page="account">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/picpoet-mark.svg" width="32" height="32" alt="">图赋 PicPoet</a>
    <nav aria-label="主导航"><a href="index.html">首页</a><a href="create.html">在线创作</a><a href="works.html">我的作品</a><a href="account.html" aria-current="page">个人中心</a></nav>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <section class="create-intro account-intro">
      <h1>个人中心</h1>
      <a class="button primary" href="create.html">去创作</a>
    </section>
    <noscript><p class="notice">此页面需要 JavaScript，请启用后重试。</p></noscript>
    <p id="page-status" class="create-status" role="status" aria-live="polite" tabindex="-1">正在检查登录状态…</p>
    <button id="retry-session" class="button secondary" type="button" hidden>重试连接</button>
    <aside id="login-gate" class="notice" hidden><h2>登录后继续</h2><a id="login-link" class="button primary" href="login.html">登录 / 注册</a></aside>
    <section class="create-panel account-panel" aria-labelledby="account-title">
      <div class="section-top"><h2 id="account-title">我的账户</h2><button id="logout" class="button quiet-button" type="button" hidden>退出登录</button></div>
      <div id="account-summary" hidden>
        <div class="account-identity"><p id="account-name"></p><span id="account-verification" class="account-badge"></span></div>
        <dl id="balance" class="account-balance" aria-label="剩余创作次数"><div><dt>剩余次数</dt><dd>加载中…</dd></div></dl>
        <div class="account-links">
          <a class="text-link" href="#purchase">补充次数</a>
          <a class="text-link" href="works.html">我的作品</a>
          <button id="refresh-balance" type="button" class="button quiet-button">刷新次数</button>
        </div>
      </div>
      <button id="retry-logout" class="button secondary" type="button" hidden>重试退出</button>
    </section>
    <section id="purchase" class="create-panel purchase-panel" aria-labelledby="plans-title">
      <div class="section-top"><h2 id="plans-title">创作套餐</h2><button id="refresh-plans" class="button quiet-button" type="button">刷新套餐</button></div>
      <p class="payment-method">支付宝</p>
      <p id="purchase-status" class="create-status" role="status" aria-live="polite" aria-atomic="true">正在加载套餐…</p>
      <div id="plans" class="plan-grid"></div>
      <button id="retry-order" type="button" class="button secondary" hidden>重试下单</button>
      <p id="order-request-id" class="request-id"></p>
    </section>
    <details id="orders-panel" class="create-panel orders-panel">
      <summary><h2 id="orders-title">我的订单</h2></summary>
      <div class="section-top"><button id="refresh-orders" type="button" class="button quiet-button" disabled>刷新订单</button></div>
      <p id="orders-status" class="create-status" role="status" aria-live="polite" hidden></p>
      <div id="orders" class="order-list"><p>登录后查看订单。</p></div>
      <nav id="orders-pagination" class="orders-pagination" aria-label="订单分页" hidden>
        <button id="orders-prev" class="button secondary" type="button" aria-controls="orders">上一页</button>
        <span id="orders-page" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="orders-next" class="button secondary" type="button" aria-controls="orders">下一页</button>
      </nav>
    </details>
  </main>
  <footer class="site-footer shell"><span>图赋 PicPoet · 让照片有诗可读</span><nav aria-label="页脚导航"><a href="docs.html">使用说明</a><a href="pricing.html">费用说明</a><a href="downloads.html">下载客户端</a></nav></footer>
</body>
</html>
